<app-navbar></app-navbar>

<div class="login-container">
<h2>Iniciar Sesión</h2>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    

    <div class="form-group">
    <label for="username">Correo Electrónico:</label>
    <input 
        type="email" 
        id="username" 
        formControlName="username" 
        placeholder="ejemplo@correo.com">
    </div>


    <div class="form-group">
    <label for="password">Contraseña:</label>
    <input 
        type="password" 
        id="password" 
        formControlName="password" 
        placeholder="Tu contraseña">
    </div>


    @if (errorMessage) {
    <p class="error-text">{{ errorMessage }}</p>
    }


    <button type="submit" [disabled]="loginForm.invalid">Ingresar</button>
</form>

<p class="register-link" style="text-align: center; margin-top: 20px; font-size: 14px; color: #c1deec;">
    ¿No tienes una cuenta? <a routerLink="/register" style="color: #3f51b5; text-decoration: none; font-weight: 600;">Regístrate aquí</a>
</p>

</div>


<app-footer></app-footer>
