<app-navbar></app-navbar>

<main class="container my-5">    
    <section class="text-center mb-5">
    <h2 class="fw-bold mb-3">Mundo ALY</h2>
    <p class="lead  mx-auto" style="max-width: 700px;">
    Somos un equipo apasionado por el bienestar y la moda deportiva. Creamos <strong>Aly</strong> para definir tu fuerza y estilo en cada entrenamiento.
    </p>

    </section>
    <hr class="my-5">

    <section class="row justify-content-center">
    <div class="col-md-6">
    <form id="formulario-contacto">

        <div class="mb-3">
        <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="nombre@correo.com">
            </div>
        <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="4" placeholder="¿En qué te podemos ayudar?"></textarea>
        </div>

        <button type="submit" class="btn btn-dark w-100 py-2">Enviar Mensaje</button>

        <div id="alerta-formulario" class="alert alert-danger d-none mt-3"></div>
    </form>
    </div>
</section>

</main>

<app-footer></app-footer>
