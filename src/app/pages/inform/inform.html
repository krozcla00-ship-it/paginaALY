<app-navbar></app-navbar>

<main class="aly-contact-wrapper">    
  <section class="aly-info-section">
    <h2 class="aly-main-title">Mundo ALY</h2>
    <p class="aly-lead-text">
      Somos un equipo apasionado por el bienestar y la moda deportiva. Creamos <strong>Aly</strong> para definir tu fuerza y estilo en cada entrenamiento.
    </p>
  </section>

  <div class="aly-divider"></div>

  <section class="aly-form-section">
    <div class="aly-card-form">
      
      <form id="formulario-contacto" class="aly-contact-form" #miFormulario="ngForm" (ngSubmit)="onEnviar()">

        <div class="aly-form-group">
          <label for="nombre" class="aly-label">Nombre Completo</label>
          <input type="text" class="aly-input" id="nombre" name="nombre" [(ngModel)]="datosForm.nombre" required placeholder="Tu nombre">
        </div>
        
        <div class="aly-form-group">
          <label for="email" class="aly-label">Correo Electrónico</label>
          
          <input 
            type="email" 
            class="aly-input" 
            id="email" 
            name="correo" 
            [(ngModel)]="datosForm.correo" 
            required 
            email 
            #correoInput="ngModel"
            placeholder="nombre@correo.com">
          
          <!-- Alerta visual que aparece únicamente si el correo no tiene formato válido -->
          <div *ngIf="correoInput.invalid && (correoInput.dirty || correoInput.touched)" style="color: #d11246; font-size: 13px; margin-top: 5px; font-weight: 500;">
            <span *ngIf="correoInput.errors?.['email']">⚠️ Ingresa un correo válido (ejemplo@correo.com).</span>
          </div>
        </div>
        
        <div class="aly-form-group">
          <label for="mensaje" class="aly-label">Mensaje</label>
          <textarea class="aly-textarea" id="mensaje" name="mensaje" [(ngModel)]="datosForm.mensaje" rows="4" required placeholder="¿En qué te podemos ayudar?"></textarea>
        </div>

        <div class="aly-btn-container">

          <button type="submit" class="aly-btn-submit" [disabled]="miFormulario.invalid">
            Enviar Mensaje
          </button>
        </div>

        <div id="alerta-formulario" class="aly-alert aly-alert-danger d-none"></div>
      </form>
    </div>
  </section>
</main>

<app-footer></app-footer>
